const KEY='halloween2026_v4';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{next:1,tickets:{}};
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function show(id){
 ['gen','val','list'].forEach(x=>$(x).classList.toggle('hidden',x!==id));
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
 $('tab'+({gen:'Gen',val:'Val',list:'List'}[id])).classList.add('active');
 if(id==='list') renderList();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function generate(){
 const name=$('name').value.trim(); const qty=Math.max(1,Math.min(10,Number($('qty').value)||1));
 if(!name){alert('Digite o nome do participante.');return}
 let out='';
 for(let n=0;n<qty;n++){
  if(db.next>300){alert('Os 300 códigos disponíveis nesta versão acabaram.');break}
  const code='HALLOWEEN-2026-'+String(db.next++).padStart(4,'0');
  db.tickets[code]={name:name,used:false,created:Date.now()};
  out += '<div class="ticket"><b>🎃 HALLOWEEN 2026</b><h3>'+esc(name)+'</h3><img src="'+QRMAP[code]+'"><div class="code">'+code+'</div><button class="print" onclick="printTicket(this)">🖨️ Imprimir / salvar PDF</button></div>';
 }
 save(); $('genOut').innerHTML=out; $('name').value=''; $('qty').value=1;
}
function printTicket(btn){
 const t=btn.closest('.ticket').cloneNode(true); t.querySelector('.print')?.remove();
 const w=window.open('','_blank'); if(!w){alert('Permita pop-ups para imprimir.');return}
 w.document.write('<!doctype html><html><head><title>Ingresso Halloween</title><style>body{text-align:center;font-family:Arial;padding:30px}img{width:280px}.code{font-family:monospace;font-weight:bold}</style></head><body>'+t.outerHTML+'</body></html>');
 w.document.close(); w.focus(); w.print();
}
function validate(){
 const code=$('code').value.trim().toUpperCase(), t=db.tickets[code];
 if(!t){$('result').innerHTML='<div class="bad">❌ INGRESSO INVÁLIDO</div>';return}
 if(t.used){$('result').innerHTML='<div class="bad">🔴 INGRESSO JÁ UTILIZADO<br><b>'+esc(t.name)+'</b></div>';return}
 t.used=true;t.usedAt=Date.now();save();
 $('result').innerHTML='<div class="ok">🟢 ENTRADA LIBERADA<br><b>'+esc(t.name)+'</b><br><small>'+code+'</small></div>'; $('code').value='';
}
function renderList(){
 const a=Object.entries(db.tickets), used=a.filter(x=>x[1].used).length;
 $('listOut').innerHTML='<p><b>'+a.length+'</b> ingressos · <b>'+used+'</b> utilizados</p>'+
 (a.length?a.map(([c,t])=>'<div class="row"><span><b>'+esc(t.name)+'</b><small>'+c+'</small></span><b>'+(t.used?'🔴':'🟢')+'</b></div>').join(''):'<small>Nenhum ingresso criado.</small>');
}
</script></body></html>
